---
Name: silvershop-productcatalog
After:
  - '#silvershop-config'
  - '#cmsextensions'
---
# Hide the catalog page types from the CMS site tree and "Add page" dialog.
# Subclasses of these types are hidden as well.
SilverShop\ProductCatalog\Extension\HideCatalogFromSiteTreeExtension:
  hidden_page_types:
    - SilverShop\Page\Product
    - SilverShop\Page\ProductCategory

SilverStripe\Admin\LeftAndMain:
  extensions:
    - SilverShop\ProductCatalog\Extension\HideCatalogFromSiteTreeExtension

# CMS edit links (e.g. from reports, link pickers and the "edit" badge) point
# at the Shop admin rather than the pages section.
SilverShop\Page\Product:
  cms_edit_owner: SilverShop\ProductCatalog\Admin\ShopAdmin

SilverShop\Page\ProductCategory:
  cms_edit_owner: SilverShop\ProductCatalog\Admin\ShopAdmin
  extensions:
    - SilverShop\ProductCatalog\Extension\ProductCategoryExtension

# The Shop admin manages everything the core Catalog admin did, so remove the
# duplicate menu item.
SilverShop\Admin\ProductCatalogAdmin:
  ignore_menuitem: true
